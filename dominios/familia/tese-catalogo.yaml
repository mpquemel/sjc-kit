# =============================================================================
# DOMÍNIO FAMÍLIA — TESES: ESQUELETO DECLARADO, PRECEDENTE NÃO CONFERIDO.
#
# Uma tese entra aqui somente depois de:
#   (a) existir na doutrina ou na jurisprudência viva;
#   (b) ter o precedente conferido pelo portão de citação;
#   (c) ter `aderencia` e `riscos` escritos por humano.
#
# Nenhuma das três aconteceu para nenhuma destas. Elas estão NOMEADAS com
# `verificado_em: null` de propósito: a estrutura do catálogo existe, o
# conteúdo não foi afirmado. Preencher de memória seria instalar o defeito na
# fundação do projeto — 10 de 136 peças tinham citação furada, e nenhuma delas
# tinha aviso.
#
# O QUE ISSO CUSTA: o S3 marca `precisa_humano: true` em praticamente todo
# caso de família até o catálogo ser preenchido com conferência. É o custo
# correto: um pipeline que inventa tese é mais perigoso do que um que pergunta.
# =============================================================================

