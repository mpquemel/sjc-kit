# =============================================================================
# CATÁLOGO DE DECISÃO (L1) — gatilho → peça cabível.
#
# É a lacuna mais séria do sistema que este projeto substitui: ninguém sabe
# por que uma peça foi escolhida. Aqui a escolha é declarada ANTES da redação,
# com prazo e base legal. O revisor confere se a peça redigida é a peça que a
# regra mandou.
#
# Regra de precedência: a PRIMEIRA regra que casa vence. Ordem importa.
# Se nenhuma casa → S3 usa o LLM com prompts/estrategia.md e marca
# confianca: baixa + precisa_humano: true. O sistema nunca fica sem resposta,
# mas diz quando a resposta não veio de regra.
#
# Validação: cada `id` é único; cada `peca_cabivel` existe em templates/;
# cada `prazo.base` é texto não vazio. `a preencher` é válido e bloqueia o run.
# =============================================================================

versao: "0.0.0"

